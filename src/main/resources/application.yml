spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:postgresql://localhost:5432/sanad}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:sanad}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:sanad}}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true

server:
  port: ${PORT:8080}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  auth:
    token-validity-hours: ${TOKEN_VALIDITY_HOURS:24}
